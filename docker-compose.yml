services:

  db:
    image: mysql:8.2.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pk_hotel_db
      MYSQL_USER: developer
      MYSQL_PASSWORD: developer
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./pk-hotel-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/pk_hotel_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: developer
      SPRING_DATASOURCE_PASSWORD: developer
    depends_on:
      - db

  frontend:
    build:
      context: ./pk-hotel-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

volumes:
  db_data: