spring:
    application:
        name: pk-hotel-backend
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3307/pk_hotel_db?createDatabaseIfNotExist=true}
        username: ${DB_USERNAME:developer}
        password: ${DB_PASSWORD:developer}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        baseline-on-migrate: true
